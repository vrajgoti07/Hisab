name: pocketplan
description: "A production-quality month-wise Budget and Expense Management System with Friends & Split."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Database
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # Navigation
  go_router: ^14.8.1

  # UI & Charts
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Export & Documents
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6
  csv: ^6.0.0

  # Sharing & Files
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Preferences & Utils
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  lucide_icons_flutter: ^4.0.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  google_sign_in: 6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
